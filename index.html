<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طعم خانه رئوف</title>
<style>
  :root{
    --cream:#F8F1E6;
    --paper:#FFFDF8;
    --olive:#687052;
    --olive-dark:#4F593D;
    --rose:#D9A3A0;
    --terracotta:#B97962;
    --brown:#5B463A;
    --muted:#8A766B;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--brown);
    font-family: Tahoma, "Vazirmatn", Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(217,163,160,.22), transparent 25%),
      radial-gradient(circle at 90% 80%, rgba(104,112,82,.16), transparent 28%),
      var(--cream);
    display:flex; justify-content:center;
  }
  .page{width:100%; max-width:520px; padding:30px 20px 34px; text-align:center}
  .brand-mark{
    width:88px;height:88px;margin:5px auto 14px;border-radius:50%;
    background:var(--olive); color:#fff; display:grid;place-items:center;
    box-shadow:0 10px 28px rgba(79,89,61,.20);
    border:7px solid rgba(255,255,255,.75);
  }
  .brand-mark span{font-size:27px;font-weight:700}
  h1{margin:0;color:var(--olive-dark);font-size:30px;letter-spacing:-1px}
  .tagline{margin:8px 0 24px;color:var(--muted);font-size:14px;line-height:2}
  .card{
    background:rgba(255,253,248,.82); border:1px solid rgba(104,112,82,.14);
    border-radius:28px; padding:22px 16px 18px;
    box-shadow:0 14px 38px rgba(91,70,58,.09);
    backdrop-filter:blur(6px);
  }
  .intro{font-size:15px;font-weight:700;color:var(--brown);margin-bottom:15px}
  .links{display:grid;gap:12px}
  a{
    text-decoration:none; color:white; min-height:62px; border-radius:18px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; transition:.2s transform,.2s box-shadow;
    box-shadow:0 7px 18px rgba(91,70,58,.10);
  }
  a:hover{transform:translateY(-2px)}
  .telegram{background:#6D9EB7}
  .bale{background:#78A98B}
  .eitaa{background:var(--terracotta)}
  .label{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700}
  .icon{
    width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.20);
    display:grid;place-items:center;font-size:18px
  }
  .arrow{font-size:20px;opacity:.9}
  .note{margin:17px 4px 0;font-size:11px;color:var(--muted);line-height:1.9}
  .footer{margin-top:22px;font-size:12px;color:var(--muted)}
  .leaf{color:var(--olive)}
</style>
</head>
<body>
<main class="page">
  <div class="brand-mark"><span>رئوف</span></div>
  <h1>طعم خانه رئوف</h1>
  <div class="tagline">طعم‌های خانگی، با عشق و مواد اولیه باکیفیت 🌿</div>

  <section class="card">
    <div class="intro">ما را در شبکه‌های اجتماعی دنبال کنید</div>
    <div class="links">
      <a class="telegram" href="https://t.me/taamekhaneraof" target="_blank" rel="noopener">
        <span class="label"><span class="icon">☆</span>کانال تلگرام</span><span class="arrow">←</span>
      </a>
      <a class="bale" href="https://ble.ir/taamekhaneraof" target="_blank" rel="noopener">
        <span class="label"><span class="icon">✦</span>کانال بله</span><span class="arrow">←</span>
      </a>
      <a class="eitaa" href="https://eitaa.com/taamekhaneraof" target="_blank" rel="noopener">
        <span class="label"><span class="icon">✿</span>کانال ایتا</span><span class="arrow">←</span>
      </a>
    </div>
    <div class="note">برای ورود به هر کانال، روی گزینه موردنظر بزنید.</div>
  </section>

  <div class="footer">با عشق از <span class="leaf">طعم خانه رئوف</span> 🌱</div>
</main>
</body>
</html>
